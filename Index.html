<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NASA-LaRC Style FMC / CDU</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cdu-container" id="cdu-box">
    <div class="cdu-top-layout">
        <!-- Sol LSK Tuşları -->
        <div class="lsk-group">
            <button class="btn-lsk" onclick="lskClick('L1')"></button>
            <button class="btn-lsk" onclick="lskClick('L2')"></button>
            <button class="btn-lsk" onclick="lskClick('L3')"></button>
            <button class="btn-lsk" onclick="lskClick('L4')"></button>
            <button class="btn-lsk" onclick="lskClick('L5')"></button>
            <button class="btn-lsk" onclick="lskClick('L6')"></button>
        </div>

        <!-- Ekran -->
        <div class="screen-frame">
            <div class="screen" id="fmc-screen">
                <div class="screen-header">
                    <span id="page-title" class="magenta">ACTIVE RTE 1 LEGS</span>
                    <span id="page-num" class="white">1/2</span>
                </div>
                <div class="screen-body" id="screen-body">
                    <!-- Dinamik İçerik -->
                </div>
                <div class="scratchpad-area">
                    <span id="scratchpad"></span>
                </div>
            </div>
        </div>

        <!-- Sağ LSK Tuşları ve Güç Düğmesi -->
        <div class="lsk-right-col">
            <div class="lsk-group">
                <button class="btn-lsk" onclick="lskClick('R1')"></button>
                <button class="btn-lsk" onclick="lskClick('R2')"></button>
                <button class="btn-lsk" onclick="lskClick('R3')"></button>
                <button class="btn-lsk" onclick="lskClick('R4')"></button>
                <button class="btn-lsk" onclick="lskClick('R5')"></button>
                <button class="btn-lsk" onclick="lskClick('R6')"></button>
            </div>
            <!-- Aç / Kapat Düğmesi -->
            <button class="power-btn" onclick="togglePower()" title="Aç/Kapat"></button>
        </div>
    </div>

    <!-- Fonksiyon Tuşları -->
    <div class="keyboard">
        <div class="func-grid">
            <button class="key func-key" onclick="changePage('INIT')">INIT REF</button>
            <button class="key func-key" onclick="changePage('RTE')">RTE</button>
            <button class="key func-key" onclick="changePage('CREW')">CREW/PAX</button>
            <button class="key func-key" onclick="changePage('SETTINGS')">SETTINGS</button>
            <button class="key func-key" onclick="changePage('LEGS')">LEGS</button>

            <button class="key func-key" onclick="pressKey('FIX')">FIX</button>
            <button class="key func-key" onclick="pressKey('HOLD')">HOLD</button>
            <button class="key func-key" onclick="pressKey('PROG')">PROG</button>
            <button class="key func-key" onclick="toggleTheme()">THEME</button>
            <button class="key func-key exec-key" onclick="pressKey('EXEC')">EXEC</button>
        </div>

        <!-- Klavyeler -->
        <div class="main-pad">
            <div class="num-pad">
                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>
                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>
                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>
                <button class="key" onclick="pressKey('.')">.</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key" onclick="pressKey('+/-')">+/-</button>
            </div>

            <div class="alpha-pad">
                <button class="key" onclick="pressKey('A')">A</button>
                <button class="key" onclick="pressKey('B')">B</button>
                <button class="key" onclick="pressKey('C')">C</button>
                <button class="key" onclick="pressKey('D')">D</button>
                <button class="key" onclick="pressKey('E')">E</button>
                <button class="key" onclick="pressKey('F')">F</button>
                <button class="key" onclick="pressKey('G')">G</button>
                <button class="key" onclick="pressKey('H')">H</button>
                <button class="key" onclick="pressKey('I')">I</button>
                <button class="key" onclick="pressKey('J')">J</button>
                <button class="key" onclick="pressKey('K')">K</button>
                <button class="key" onclick="pressKey('L')">L</button>
                <button class="key" onclick="pressKey('M')">M</button>
                <button class="key" onclick="pressKey('N')">N</button>
                <button class="key" onclick="pressKey('O')">O</button>
                <button class="key" onclick="pressKey('P')">P</button>
                <button class="key" onclick="pressKey('Q')">Q</button>
                <button class="key" onclick="pressKey('R')">R</button>
                <button class="key" onclick="pressKey('S')">S</button>
                <button class="key" onclick="pressKey('T')">T</button>
                <button class="key" onclick="pressKey('U')">U</button>
                <button class="key" onclick="pressKey('V')">V</button>
                <button class="key" onclick="pressKey('W')">W</button>
                <button class="key" onclick="pressKey('X')">X</button>
                <button class="key" onclick="pressKey('Y')">Y</button>
                <button class="key" onclick="pressKey('Z')">Z</button>
                <button class="key action-key" onclick="pressKey('SPC')">SPC</button>
                <button class="key action-key" onclick="pressKey('/')">/</button>
                <button class="key action-key" onclick="pressKey('DEL')">DEL</button>
                <button class="key action-key" onclick="pressKey('CLR')">CLR</button>
            </div>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
